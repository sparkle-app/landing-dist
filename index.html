<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparkle Lab — Products</title>
<style>
:root {
  --bg: #f4f5f9;
  --ink: #1d1d1f;
  --mute: #636369;
  --divider: rgba(29, 29, 31, 0.16);

  /* Liquid Glass surfaces (Light) */
  --glass-bg: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.65) 0%,
    rgba(255, 255, 255, 0.32) 50%,
    rgba(255, 255, 255, 0.52) 100%
  );
  --glass-hover: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.82) 0%,
    rgba(255, 255, 255, 0.46) 50%,
    rgba(255, 255, 255, 0.70) 100%
  );
  --glass-off: linear-gradient(
    135deg,
    rgba(235, 236, 242, 0.45) 0%,
    rgba(225, 226, 234, 0.25) 100%
  );
  --glass-border: rgba(255, 255, 255, 0.75);
  --glass-edge: rgba(29, 29, 31, 0.08);
  --glass-specular:
    inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.92),
    inset 1px 0 1px 0 rgba(255, 255, 255, 0.55),
    inset 0 -1.5px 2px 0 rgba(255, 255, 255, 0.35),
    0 12px 32px -10px rgba(20, 22, 36, 0.10),
    0 2px 6px rgba(20, 22, 36, 0.04);
  --glass-specular-hover:
    inset 0 2px 2px 0 rgba(255, 255, 255, 1),
    inset 1.5px 0 1.5px 0 rgba(255, 255, 255, 0.7),
    inset 0 -2px 4px 0 rgba(255, 255, 255, 0.5),
    0 24px 48px -12px rgba(20, 22, 36, 0.18),
    0 4px 12px rgba(20, 22, 36, 0.06);
  --pill-bg: rgba(255, 255, 255, 0.55);
  --halo: rgba(244, 245, 249, 0.82);

  /* Skeleton styling */
  --skeleton-base: rgba(0, 0, 0, 0.06);
  --skeleton-highlight: rgba(255, 255, 255, 0.75);

  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #050508;
    --ink: #f5f5f7;
    --mute: #9a9aa2;
    --divider: rgba(255, 255, 255, 0.22);

    --glass-bg: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.13) 0%,
      rgba(255, 255, 255, 0.04) 50%,
      rgba(255, 255, 255, 0.09) 100%
    );
    --glass-hover: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.20) 0%,
      rgba(255, 255, 255, 0.07) 50%,
      rgba(255, 255, 255, 0.14) 100%
    );
    --glass-off: linear-gradient(
      135deg,
      rgba(255, 255, 255, 0.06) 0%,
      rgba(255, 255, 255, 0.02) 100%
    );
    --glass-border: rgba(255, 255, 255, 0.18);
    --glass-edge: rgba(255, 255, 255, 0.12);
    --glass-specular:
      inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.32),
      inset 1px 0 1px 0 rgba(255, 255, 255, 0.14),
      inset 0 -1.5px 2px 0 rgba(255, 255, 255, 0.08),
      0 16px 40px -12px rgba(0, 0, 0, 0.65),
      0 2px 8px rgba(0, 0, 0, 0.4);
    --glass-specular-hover:
      inset 0 2px 2px 0 rgba(255, 255, 255, 0.48),
      inset 1.5px 0 1.5px 0 rgba(255, 255, 255, 0.22),
      inset 0 -2px 4px 0 rgba(255, 255, 255, 0.14),
      0 28px 56px -12px rgba(0, 0, 0, 0.82),
      0 6px 16px rgba(0, 0, 0, 0.5);
    --pill-bg: rgba(255, 255, 255, 0.08);
    --halo: rgba(5, 5, 8, 0.78);

    --skeleton-base: rgba(255, 255, 255, 0.06);
    --skeleton-highlight: rgba(255, 255, 255, 0.16);

    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #050508;
  --ink: #f5f5f7;
  --mute: #9a9aa2;
  --divider: rgba(255, 255, 255, 0.22);
  --glass-bg: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.13) 0%,
    rgba(255, 255, 255, 0.04) 50%,
    rgba(255, 255, 255, 0.09) 100%
  );
  --glass-hover: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.20) 0%,
    rgba(255, 255, 255, 0.07) 50%,
    rgba(255, 255, 255, 0.14) 100%
  );
  --glass-off: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.06) 0%,
    rgba(255, 255, 255, 0.02) 100%
  );
  --glass-border: rgba(255, 255, 255, 0.18);
  --glass-edge: rgba(255, 255, 255, 0.12);
  --glass-specular:
    inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.32),
    inset 1px 0 1px 0 rgba(255, 255, 255, 0.14),
    inset 0 -1.5px 2px 0 rgba(255, 255, 255, 0.08),
    0 16px 40px -12px rgba(0, 0, 0, 0.65),
    0 2px 8px rgba(0, 0, 0, 0.4);
  --glass-specular-hover:
    inset 0 2px 2px 0 rgba(255, 255, 255, 0.48),
    inset 1.5px 0 1.5px 0 rgba(255, 255, 255, 0.22),
    inset 0 -2px 4px 0 rgba(255, 255, 255, 0.14),
    0 28px 56px -12px rgba(0, 0, 0, 0.82),
    0 6px 16px rgba(0, 0, 0, 0.5);
  --pill-bg: rgba(255, 255, 255, 0.08);
  --halo: rgba(5, 5, 8, 0.78);
  --skeleton-base: rgba(255, 255, 255, 0.06);
  --skeleton-highlight: rgba(255, 255, 255, 0.16);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }

html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  margin: 0;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color .4s ease, color .4s ease;
}

#field {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  animation: fade .6s ease-out backwards;
}

@keyframes fade { from { opacity: 0; } }

/* Top Navigation Bar */
.topbar {
  position: fixed;
  top: max(18px, env(safe-area-inset-top, 18px));
  left: 24px;
  right: 24px;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  pointer-events: none;
}

.brand-pill,
.theme-toggle {
  pointer-events: auto;
  border-radius: 999px;
  border: 1px solid var(--glass-edge);
  background: var(--glass-bg);
  box-shadow: var(--glass-specular);
  backdrop-filter: blur(26px) saturate(200%);
  -webkit-backdrop-filter: blur(26px) saturate(200%);
  transition: transform .35s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow .35s ease,
              background .35s ease;
}

.brand-pill {
  display: inline-flex;
  align-items: center;
  padding: 9px 18px 9px 14px;
  text-decoration: none;
  color: var(--ink);
}

.brand-pill:hover,
.theme-toggle:hover {
  transform: translateY(-2px) scale(1.02);
  background: var(--glass-hover);
  box-shadow: var(--glass-specular-hover);
}

.brand-logo-svg {
  display: block;
  height: 26px;
  width: auto;
}

.theme-toggle {
  width: 44px;
  height: 44px;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
}

.brand-pill:focus-visible,
.theme-toggle:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}

main {
  position: relative;
  z-index: 1;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12vh 24px 8vh;
  overflow-x: clip;
}

.hero {
  position: relative;
  padding: 18px 36px;
  border-radius: 36px;
  background: radial-gradient(closest-side, var(--halo) 65%, transparent 100%);
}

h1 {
  margin: 0;
  color: var(--ink);
  font-size: clamp(2.5rem, 6.4vw, 4.75rem);
  font-weight: 650;
  line-height: 1.04;
  letter-spacing: -0.04em;
}

.products {
  list-style: none;
  margin: clamp(44px, 9vh, 84px) 0 0;
  padding: 0;
  width: 100%;
  max-width: 980px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
}
@media (max-width: 980px) { .products { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .products { grid-template-columns: 1fr; } }

.products li { display: flex; }

/* Liquid Glass Card */
.card {
  position: relative;
  width: 100%;
  min-height: 240px;
  padding: 24px 22px;
  border-radius: 28px;
  border: 1px solid var(--glass-edge);
  background: var(--glass-bg);
  box-shadow: var(--glass-specular);
  backdrop-filter: blur(28px) saturate(210%);
  -webkit-backdrop-filter: blur(28px) saturate(210%);
  color: var(--ink);
  text-decoration: none;
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 18px;
  overflow: hidden;
  transition: transform .4s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow .4s ease,
              border-color .4s ease,
              background .4s ease;
}

.card-body {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

.micro-preview {
  margin-top: auto;
}

/* Liquid caustic light refraction following cursor */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(
    280px circle at var(--mx, 50%) var(--my, 0%),
    rgba(255, 255, 255, 0.38),
    color-mix(in srgb, var(--accent) 22%, transparent) 45%,
    transparent 75%
  );
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
}

/* Top liquid specular rim */
.card::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    145deg,
    rgba(255, 255, 255, 0.85) 0%,
    rgba(255, 255, 255, 0.12) 45%,
    color-mix(in srgb, var(--accent) 35%, transparent) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity: 0.65;
  pointer-events: none;
  transition: opacity .35s ease;
}

.card:not([aria-disabled="true"]):hover::before,
.card:not([aria-disabled="true"]):focus-visible::before {
  opacity: 1;
}

.card:not([aria-disabled="true"]):hover::after,
.card:not([aria-disabled="true"]):focus-visible::after {
  opacity: 1;
}

.card:not([aria-disabled="true"]):hover,
.card:not([aria-disabled="true"]):focus-visible {
  transform: translateY(-6px) scale(1.012);
  background: var(--glass-hover);
  box-shadow: var(--glass-specular-hover);
}

.card:not([aria-disabled="true"]):active {
  transform: translateY(-2px) scale(.985);
}

.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

.card[aria-disabled="true"] {
  background: var(--glass-off);
  cursor: default;
  opacity: 0.72;
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}

.icon-wrap {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: color-mix(in srgb, var(--accent) 16%, var(--pill-bg));
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6);
  color: var(--accent);
}

.icon-wrap svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.arrow {
  width: 30px;
  height: 30px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--mute);
  background: var(--pill-bg);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
  transition: transform .3s cubic-bezier(0.22, 1, 0.36, 1), color .25s ease, background .25s ease;
}

.card:not([aria-disabled="true"]):hover .arrow {
  transform: translate(2px, -2px) scale(1.06);
  color: #fff;
  background: var(--accent);
}

.card-body { position: relative; z-index: 1; }

.card-title {
  display: block;
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-bottom: 5px;
}

.card-desc {
  margin: 0;
  color: var(--mute);
  font-size: 14.5px;
  line-height: 1.42;
}

.micro-preview {
  position: relative;
  z-index: 1;
  padding-top: 13px;
  border-top: 1px solid var(--glass-edge);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--mute);
  gap: 8px;
}

/* Badges (2 per card) */
.badge-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
}

.badge-accent {
  background: color-mix(in srgb, var(--accent) 15%, var(--pill-bg));
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 26%, transparent);
}

.badge-neutral {
  background: var(--pill-bg);
  color: var(--mute);
  border: 1px solid var(--glass-edge);
  font-weight: 500;
}

/* Skeleton Elements for disabled cards */
.skeleton-shimmer {
  background: linear-gradient(
    90deg,
    var(--skeleton-base) 0%,
    var(--skeleton-highlight) 50%,
    var(--skeleton-base) 100%
  );
  background-size: 200% 100%;
  animation: shimmer 2.8s ease-in-out infinite;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.skeleton-icon {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  border: 1px solid var(--glass-edge);
}

.skeleton-title {
  height: 22px;
  width: 68%;
  border-radius: 8px;
  margin-bottom: 9px;
}

.skeleton-desc-1 {
  height: 14px;
  width: 95%;
  border-radius: 6px;
  margin-bottom: 6px;
}

.skeleton-desc-2 {
  height: 14px;
  width: 58%;
  border-radius: 6px;
}

.skeleton-badge {
  height: 24px;
  border-radius: 8px;
  border: 1px solid var(--glass-edge);
}

.skeleton-badge.b-short { width: 44px; }
.skeleton-badge.b-long { width: 66px; }

@media (max-width: 520px) {
  .topbar { left: 16px; right: 16px; }
  .brand-logo-svg { height: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  #field { animation: none; }
  .card, .arrow, .brand-pill, .theme-toggle, .skeleton-shimmer { transition: none; animation: none; }
}
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>

<header class="topbar">
  <!-- Inline SVG logo: works standalone and adapts to theme -->
  <a class="brand-pill" href="#" aria-label="Sparkle Lab">
    <svg class="brand-logo-svg" viewBox="0 0 430 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sparkle Lab">
      <defs>
        <linearGradient id="triRim" x1="0" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#fff5f2"/>
          <stop offset="50%" stop-color="#ffb8c6"/>
          <stop offset="100%" stop-color="#ffdca8"/>
        </linearGradient>
        <linearGradient id="triCore" x1="18" y1="12" x2="48" y2="56" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ff247f"/>
          <stop offset="52%" stop-color="#ff5e3a"/>
          <stop offset="100%" stop-color="#ffb91d"/>
        </linearGradient>
        <g id="sparkleTri">
          <path d="M25.5 7.5C27.5 3.9 32.5 3.9 34.5 7.5L56.2 46.5C58.1 50 55.6 54.3 51.6 54.3H8.4C4.4 54.3 1.9 50 3.8 46.5L25.5 7.5Z" fill="url(#triRim)"/>
          <path d="M27.2 14.2C28.5 11.9 31.5 11.9 32.8 14.2L50.4 45.8C51.7 48.1 50.1 50.9 47.5 50.9H12.5C9.9 50.9 8.3 48.1 9.6 45.8L27.2 14.2Z" fill="url(#triCore)"/>

      <use href="#sparkleTri" x="0" y="3"/>

      <line x1="204" y1="6" x2="204" y2="58" stroke="var(--divider)" stroke-width="2" stroke-linecap="round"/>
      <text x="224" y="45" fill="currentColor" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif" font-size="38" font-weight="400" letter-spacing="-0.02em">Sparkle Lab</text>
    </svg>
  </a>

  <button class="theme-toggle" id="themeBtn" type="button" aria-label="Toggle color theme" title="Toggle theme">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
  </button>
</header>

<main>
  <div class="hero">
    <h1>Everything<br>one tap away</h1>
  </div>

  <ul class="products">
    <!-- Card 1: Аналитика для бизнеса (B2B Консалтинг) -->
    <li>
      <a class="card" href="https://sparkle-app.github.io/sparkleapp-dist/" style="--accent:#ff8a3d" data-color="#ff8a3d" aria-describedby="d1">
        <div class="card-top">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          </span>
          <span class="arrow" aria-hidden="true">↗</span>
        </div>
        <div class="card-body">
          <span class="card-title">аналитика для бизнеса</span>
          <p class="card-desc" id="d1">стратегическая сессия, риски, RGM</p>
        </div>
        <div class="micro-preview">
          <span class="badge-pill badge-accent">B2B</span>
          <span class="badge-pill badge-neutral">консалтинг</span>
        </div>
      </a>

    <!-- Card 2: Курьерская аналитика (B2C Доход) -->
    <li>
      <a class="card" href="https://sparkle-app.github.io/courier-analytics-concept/" style="--accent:#ff3d71" data-color="#ff3d71" aria-describedby="d2">
        <div class="card-top">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>

        </div>
        <div class="micro-preview">
          <span class="badge-pill badge-accent">B2C</span>

      </a>

    <!-- Card 3: Disabled / Skeleton -->
    <li>
      <div class="card" role="link" aria-disabled="true" style="--accent:#7a5cff" data-color="#7a5cff" aria-describedby="d3">
        <div class="card-top">
          <span class="skeleton-icon skeleton-shimmer" aria-hidden="true"></span>
        </div>
        <div class="card-body">
          <div class="skeleton-title skeleton-shimmer"></div>
          <div class="skeleton-desc-1 skeleton-shimmer"></div>
          <div class="skeleton-desc-2 skeleton-shimmer"></div>
        </div>
        <div class="micro-preview">
          <span class="skeleton-badge b-short skeleton-shimmer"></span>
          <span class="skeleton-badge b-long skeleton-shimmer"></span>
        </div>
      </div>

    <!-- Card 4: Disabled / Skeleton -->
    <li>
      <div class="card" role="link" aria-disabled="true" style="--accent:#2fb8ff" data-color="#2fb8ff" aria-describedby="d4">
        <div class="card-top">
          <span class="skeleton-icon skeleton-shimmer" aria-hidden="true"></span>
        </div>
        <div class="card-body">
          <div class="skeleton-title skeleton-shimmer"></div>
          <div class="skeleton-desc-1 skeleton-shimmer"></div>
          <div class="skeleton-desc-2 skeleton-shimmer"></div>
        </div>
        <div class="micro-preview">
          <span class="skeleton-badge b-short skeleton-shimmer"></span>
          <span class="skeleton-badge b-long skeleton-shimmer"></span>
        </div>
      </div>
    </li>

</main>

<script>
(() => {
  const root = document.documentElement;
  document.getElementById('themeBtn').addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark' ||
      (!root.hasAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  const cards = document.querySelectorAll('.card');
  cards.forEach(card => {
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', `${e.clientX - r.left}px`);
      card.style.setProperty('--my', `${e.clientY - r.top}px`);
    });
  });

  const c = document.getElementById('field'), x = c.getContext('2d');
  const C = ['#ff8a3d', '#ff3d71', '#7a5cff', '#2fb8ff', '#34c759'];
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = 0, h = 0, D = [], m = { x: -1e3, y: -1e3 }, activeColor = null, running = false, rt;

  const initDots = (count) => {
    D = Array.from({ length: count }, (_, i) => {
      const nx = Math.random(), ny = Math.random();
      return { nx, ny, hx: nx * w, hy: ny * h, x: nx * w, y: ny * h, c: C[i % 5], r: 1.6 + Math.random() * 2.4 };
    });
  };

  const fit = () => {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * d; c.height = h * d;
    x.setTransform(d, 0, 0, d, 0, 0);
    const targetCount = Math.min(540, w * h / 4600 | 0);
    if (!D.length) initDots(targetCount);
    else D.forEach(p => { p.hx = p.nx * w; p.hy = p.ny * h; });
  };

  const tick = () => {
    if (document.hidden) { running = false; return; }
    x.clearRect(0, 0, w, h);
    let busy = false;
    D.forEach(p => {
      const dx = p.x - m.x, dy = p.y - m.y, dist = Math.hypot(dx, dy);
      const f = dist < 150 ? (150 - dist) / 150 * 70 : 0;
      const tx = p.hx + (dx / dist || 0) * f, ty = p.hy + (dy / dist || 0) * f;
      p.x += (tx - p.x) * .09; p.y += (ty - p.y) * .09;
      if (Math.abs(tx - p.x) + Math.abs(ty - p.y) > .05) busy = true;
      const match = activeColor && p.c === activeColor;
      x.globalAlpha = activeColor ? (match ? 0.95 : 0.22) : 0.76;
      x.fillStyle = p.c;
      x.beginPath();
      x.arc(p.x, p.y, match ? p.r * 1.3 : p.r, 0, 7);
      x.fill();
    });
    if (busy) requestAnimationFrame(tick); else running = false;
  };
  const wake = () => { if (!running && !RM) { running = true; requestAnimationFrame(tick); } else if (RM) { tick(); } };

  fit(); tick();
  if (!RM) {
    addEventListener('pointermove', e => { m.x = e.clientX; m.y = e.clientY; wake(); }, { passive: true });
    document.documentElement.addEventListener('pointerleave', () => { m.x = -1e3; wake(); });
    addEventListener('pointerup', e => { if (e.pointerType === 'touch') { setTimeout(() => { m.x = -1e3; wake(); }, 350); } });
  }
  cards.forEach(card => {
    if (card.getAttribute('aria-disabled') === 'true') return;
    card.addEventListener('pointerenter', () => { activeColor = card.dataset.color; tick(); });
    card.addEventListener('pointerleave', () => { activeColor = null; tick(); });
    card.addEventListener('focus', () => { activeColor = card.dataset.color; tick(); });
    card.addEventListener('blur', () => { activeColor = null; tick(); });
  });
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fit(); wake(); }, 120); });
})();
</script>
</body>
</html>
